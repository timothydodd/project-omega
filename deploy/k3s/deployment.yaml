apiVersion: apps/v1
kind: Deployment
metadata:
  name: omega
  labels:
    app.kubernetes.io/name: omega
spec:
  # SQLite has a single writer: exactly one pod, and stop the old one before starting the new one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: omega
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omega
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: omega
          image: ghcr.io/timothydodd/project-omega
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3300
          env:
            - name: OMEGA_DB
              value: /data/omega.db
            # Public address used in tracking snippets (otherwise set it on the dashboard's Settings page).
            # - name: OMEGA_PUBLIC_URL
            #   value: https://analytics.example.com
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp # SQLite temp files for large sorts
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omega-data
        - name: tmp
          emptyDir: {}
